---
layout: default
---
<article class="post"{% if page.lang %} lang="{{ page.lang | escape }}"{% endif %}>
  <header class="post-header">
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%d.%m.%Y' }}</time>
    <h1>{{ page.title | escape }}</h1>
    {% if page.description %}<p class="lede">{{ page.description | escape }}</p>{% endif %}
  </header>
  <div class="prose">
    {{ content }}
  </div>
</article>
