---
layout: default
---
<article class="post"{% if page.lang %} lang="{{ page.lang | escape }}"{% endif %}>
  <header class="post-header">
    <h1>{{ page.title | escape }}</h1>
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%b %-d, %Y' }}</time>
    {% if page.description %}<p class="lede">{{ page.description | escape }}</p>{% endif %}
  </header>
  <div class="prose">
    {{ content }}
  </div>
  <footer class="post-footer">
    <a href="{{ '/#notes' | relative_url }}">All notes</a>
  </footer>
</article>
