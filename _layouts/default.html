<!doctype html>
<html lang="{{ site.lang | escape }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
    {% if page.math %}
      <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-chtml.js"></script>
    {% endif %}
  </head>
  <body>
    <a class="skip-link" href="#content">К содержанию</a>
    <header class="site-header shell">
      <a class="wordmark" href="{{ '/' | relative_url }}">{{ site.author | escape }}</a>
      <nav aria-label="Навигация">
        <a href="{{ '/#notes' | relative_url }}">Заметки</a>
        <a href="{{ site.github_profile }}">GitHub</a>
      </nav>
    </header>
    <main id="content" class="shell" tabindex="-1">
      {{ content }}
    </main>
    <footer class="site-footer shell">
      <span>{{ site.author | escape }}</span>
      <a href="{{ '/#notes' | relative_url }}">К списку заметок</a>
    </footer>
  </body>
</html>
